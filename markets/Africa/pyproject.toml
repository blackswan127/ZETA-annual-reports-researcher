[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "africa-ar-bulk"
version = "1.0.0"
description = "Production-grade bulk annual report harvester for African equity markets"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.27,<1",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
africa-ar = "africa_ar_bulk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

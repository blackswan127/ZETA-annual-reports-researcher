[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "lka-cse-bulk"
version = "1.0.0"
description = "Colombo Stock Exchange FY2017-FY2025 annual-report harvester with ZETA output"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "pypdf>=5,<7"]
[project.scripts]
cse-ar = "lka_cse_bulk.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

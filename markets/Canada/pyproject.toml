[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canada-zeta-annual-reports-bulk"
version = "1.0.0"
description = "ZETA-SOP production annual-report harvester for current TSX/TSXV companies, FY2017-FY2025"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
canada-zeta-ar = "canada_zeta_bulk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

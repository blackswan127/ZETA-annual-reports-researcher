[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dse-zeta-annual-bulk"
version = "1.0.0"
description = "Production-grade Dhaka Stock Exchange current-listed annual report harvester for ZETA AI FY2017-FY2025"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pypdf>=4.0"
]

[project.scripts]
dse-zeta = "dse_zeta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
